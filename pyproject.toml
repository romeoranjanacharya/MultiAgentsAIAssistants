[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agents-ai-assistants"
version = "0.1.0"
description = "A research and writing multi-agent assistant starter project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "romeoranjanacharya"}]
dependencies = []

[project.scripts]
multi-agents-ai-assistants = "multi_agents_ai_assistants.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
